name: wakio
description: "Mission-based alarm clock. Prove you are awake."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Already present transitively; promoted to a direct dependency so we can
  # read the manufacturer and warn about vendor battery managers, which are
  # the top cause of missed alarms on Android. Adds no binary size.
  device_info_plus: ^12.4.0
  crypto: ^3.0.7
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  sensors_plus: ^7.1.0
  camera: ^0.12.0+1
  audioplayers: ^6.8.1
  record: ^7.1.1
  file_picker: ^11.0.2
  vibration: ^3.2.0
  wakelock_plus: ^1.5.2
  permission_handler: ^12.0.3
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.1
  in_app_purchase_storekit: ^0.4.10+1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  uuid: ^4.5.3
  image: ^4.8.0
  url_launcher: ^6.3.2
  intl: any
  in_app_review: ^2.0.12
  google_mlkit_pose_detection: ^0.15.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/
    - assets/mascot/

  # Rounded, playful type (Duolingo-style). Both are variable fonts — one
  # file each covers the whole weight range we use.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
